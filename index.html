<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор кухни — Калькулятор стоимости</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .calculator-card {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #eceff1;
            padding-bottom: 10px;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 20px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .status-loading { background: #fff3cd; color: #856404; }
        .status-success { background: #d4edda; color: #155724; }
        .status-error { background: #f8d7da; color: #721c24; }

        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #455a64;
        }
        select, input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cfd8dc;
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #fff;
            transition: border-color 0.2s;
        }
        select:focus, input[type="number"]:focus {
            outline: none;
            border-color: #3498db;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 120px;
            gap: 12px;
            align-items: end;
        }
        .total-box {
            margin-top: 30px;
            padding: 20px;
            background: #2c3e50;
            color: #ffffff;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .total-title {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .total-price {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2ecc71;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>Калькулятор стоимости кухни</h2>
    <div id="statusBadge" class="status-badge status-loading">⏳ Подключение к базе данных...</div>

    <!-- ДСП -->
    <div class="form-group">
        <label for="dspSelect">Материал ДСП (Каркас):</label>
        <select id="dspSelect" onchange="recalculate()"><option value="0">Загрузка...</option></select>
    </div>

    <!-- МДФ / Фасады -->
    <div class="form-group">
        <label for="mdfSelect">Панели МДФ (Фасады):</label>
        <select id="mdfSelect" onchange="recalculate()"><option value="0">Загрузка...</option></select>
    </div>

    <!-- Столешницы -->
    <div class="form-group">
        <label for="tabletopSelect">Столешница:</label>
        <select id="tabletopSelect" onchange="recalculate()"><option value="0">Загрузка...</option></select>
    </div>

    <!-- Петли -->
    <div class="form-group grid-2">
        <div>
            <label for="hingeSelect">Петли:</label>
            <select id="hingeSelect" onchange="recalculate()"><option value="0">Загрузка...</option></select>
        </div>
        <div>
            <label for="hingeCount">Кол-во (шт):</label>
            <input type="number" id="hingeCount" value="10" min="0" oninput="recalculate()">
        </div>
    </div>

    <!-- Подъёмники -->
    <div class="form-group grid-2">
        <div>
            <label for="liftSelect">Подъёмные механизмы:</label>
            <select id="liftSelect" onchange="recalculate()"><option value="0">Загрузка...</option></select>
        </div>
        <div>
            <label for="liftCount">Кол-во (шт):</label>
            <input type="number" id="liftCount" value="2" min="0" oninput="recalculate()">
        </div>
    </div>

    <!-- Ручки -->
    <div class="form-group grid-2">
        <div>
            <label for="handleSelect">Ручки:</label>
            <select id="handleSelect" onchange="recalculate()"><option value="0">Загрузка...</option></select>
        </div>
        <div>
            <label for="handleCount">Кол-во (шт):</label>
            <input type="number" id="handleCount" value="8" min="0" oninput="recalculate()">
        </div>
    </div>

    <!-- Направляющие -->
    <div class="form-group grid-2">
        <div>
            <label for="guideSelect">Направляющие для ящиков:</label>
            <select id="guideSelect" onchange="recalculate()"><option value="0">Загрузка...</option></select>
        </div>
        <div>
            <label for="guideCount">Ящиков (шт):</label>
            <input type="number" id="guideCount" value="4" min="0" oninput="recalculate()">
        </div>
    </div>

    <!-- Итог -->
    <div class="total-box">
        <div class="total-title">Итоговая стоимость:</div>
        <div class="total-price" id="totalPrice">0 MDL</div>
    </div>
</div>

<script>
    // Базовый URL вашей Google Таблицы
    const BASE_SPREADSHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTzDjxq-Tys5RiT0DTPpNNb4sv23gi1MTQFrGHlIqA4YT82Yd63eKoKK3nCfmTx3CDwdoFVlP2ii3bl/pub?output=csv";

    // Идентификаторы листов (gid) для каждого раздела
    const SHEETS = {
        dsp: { gid: "0", elementId: "dspSelect" },
        mdf: { gid: "96674774", elementId: "mdfSelect" },
        tabletop: { gid: "815843097", elementId: "tabletopSelect" },
        hinges: { gid: "100000001", elementId: "hingeSelect" },   // Укажите ваш gid для Петель
        lifts: { gid: "100000002", elementId: "liftSelect" },    // Укажите ваш gid для Подъёмников
        handles: { gid: "100000003", elementId: "handleSelect" },  // Укажите ваш gid для Ручек
        guides: { gid: "100000004", elementId: "guideSelect" }   // Укажите ваш gid для Направляющих
    };

    // Загрузка данных с резервными прокси-серверами[cite: 1]
    async function fetchCsvData(gid) {
        const targetUrl = `${BASE_SPREADSHEET_URL}&gid=${gid}&single=true`;
        const proxies = [
            `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
            `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
            targetUrl
        ];

        for (const url of proxies) {
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const text = await res.text();
                    if (text && text.length > 20) return text;
                }
            } catch (e) {
                console.warn(`Прокси не ответил, пробуем следующий: ${url}`);
            }
        }
        throw new Error(`Не удалось загрузить данные для gid=${gid}`);
    }

    // Универсальный парсер CSV без фильтрации строк по наименованию[cite: 1]
    function parseCsvToOptions(csvText) {
        const options = [];
        const lines = csvText.split(/\r?\n/);

        lines.forEach((line, index) => {
            if (!line.trim()) return;

            // Разбиваем строку CSV, корректно обрабатывая кавычки и скобки[cite: 1]
            let cols = line.match(/(".*?"|[^",\t]+)(?=\s*,|\s*$)/g) || line.split(/[|\t]/);
            if (!cols) return;

            cols = cols.map(item => item.replace(/^"|"$/g, '').trim());

            let title = cols[0];

            // Пропускаем строки заголовков и ошибки таблицы (#N/A, #Н/Д)[cite: 1]
            if (index === 0 && (title.toLowerCase().includes("название") || title.toLowerCase().includes("наименование"))) return;
            if (!title || title.includes("#N/A") || title.includes("#Н/Д") || title.includes("Фаворит")) return;

            // Извлекаем чистую цену
            let priceNum = NaN;
            for (let i = 1; i < cols.length; i++) {
                let cleanStr = cols[i].replace(/\s+/g, '').replace(',', '.');
                let match = cleanStr.match(/(\d+[\.]?\d*)/);
                if (match) {
                    let parsed = parseFloat(match[0]);
                    if (!isNaN(parsed) && parsed > 0) {
                        priceNum = parsed;
                        break;
                    }
                }
            }

            if (title && !isNaN(priceNum)) {
                options.push({ name: title, price: priceNum });
            }
        });

        return options;
    }

    // Загрузка ВСЕХ позиций из конкретного листа без отсечения[cite: 1]
    async function loadSheet(sheetConfig) {
        const selectEl = document.getElementById(sheetConfig.elementId);
        if (!selectEl) return 0;

        try {
            const csvText = await fetchCsvData(sheetConfig.gid);
            const items = parseCsvToOptions(csvText);

            selectEl.innerHTML = ''; // Очищаем 'Загрузка...'

            if (items.length === 0) {
                selectEl.innerHTML = '<option value="0">-- Нет доступных позиций --</option>';
                return 0;
            }

            items.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.price;
                opt.textContent = `${item.name} — ${item.price} MDL`;
                selectEl.appendChild(opt);
            });

            return items.length;
        } catch (err) {
            console.error(`Ошибка загрузки листа gid=${sheetConfig.gid}:`, err);
            selectEl.innerHTML = '<option value="0">Ошибка загрузки</option>';
            return 0;
        }
    }

    // Инициализация подгрузки всех категорий
    async function initCalculator() {
        const statusBadge = document.getElementById('statusBadge');
        statusBadge.className = "status-badge status-loading";
        statusBadge.innerText = "⏳ Загрузка всех баз данных...";

        const tasks = Object.values(SHEETS).map(sheet => loadSheet(sheet));
        const results = await Promise.all(tasks);

        const totalLoaded = results.reduce((acc, count) => acc + count, 0);

        if (totalLoaded > 0) {
            statusBadge.className = "status-badge status-success";
            statusBadge.innerText = `✓ Все позиции успешно загружены!`;
        } else {
            statusBadge.className = "status-badge status-error";
            statusBadge.innerText = "⚠️ Ошибка подгрузки некоторых разделов. Проверьте gid листов.";
        }

        recalculate();
    }

    // Функция расчёта итоговой стоимости
    function recalculate() {
        const getVal = (id) => parseFloat(document.getElementById(id)?.value) || 0;

        const dspPrice = getVal('dspSelect');
        const mdfPrice = getVal('mdfSelect');
        const tabletopPrice = getVal('tabletopSelect');

        const hingePrice = getVal('hingeSelect') * getVal('hingeCount');
        const liftPrice = getVal('liftSelect') * getVal('liftCount');
        const handlePrice = getVal('handleSelect') * getVal('handleCount');
        
        // Направляющие: если цена в базе за 1 штуку, умножаем на 2 (пара на ящик)
        const guidePrice = getVal('guideSelect') * getVal('guideCount');

        const total = dspPrice + mdfPrice + tabletopPrice + hingePrice + liftPrice + handlePrice + guidePrice;

        document.getElementById('totalPrice').innerText = `${total.toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} MDL`;
    }

    window.addEventListener('DOMContentLoaded', initCalculator);
</script>

</body>
</html>
