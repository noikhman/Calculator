<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор материалов — Фаворит</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f1f5f9;
            padding: 20px;
            color: #1e293b;
            margin: 0;
        }

        .card {
            max-width: 550px;
            margin: 40px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #cbd5e1;
        }

        h3 {
            margin-top: 0;
            color: #5c1724; /* Фирменный цвет «Фаворит» */
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .status-loading { background: #fef3c7; color: #b45309; }
        .status-success { background: #dcfce7; color: #15803d; }
        .status-error { background: #fee2e2; color: #b91c1c; }

        .form-group { margin-bottom: 15px; }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus { border-color: #5c1724; }

        .price-box {
            margin-top: 15px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
            border-left: 4px solid #5c1724;
            font-size: 1rem;
            line-height: 1.5;
        }

        .access-denied {
            max-width: 450px;
            margin: 80px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            border-top: 5px solid #ef4444;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .access-denied h2 { color: #b91c1c; margin-top: 0; }
        .ip-badge { background: #f1f5f9; padding: 4px 8px; border-radius: 4px; font-family: monospace; font-weight: bold; }
    </style>
</head>
<body>

<div id="appContainer" style="display: none;">
    <div class="card">
        <h3>Каталог материалов (favoritmd.com)</h3>
        <div id="statusBadge" class="status-badge status-loading">⏳ Предзагрузка всей базы данных...</div>

        <!-- Переключатель категорий -->
        <div class="form-group">
            <label for="categorySelect">📂 Категория материала:</label>
            <select id="categorySelect" onchange="switchCategory()">
                <option value="dsp">ДСП</option>
                <option value="mdf">Панели МДФ</option>
            </select>
        </div>

        <div class="form-group">
            <label for="searchBox">🔍 Быстрый поиск:</label>
            <input type="text" id="searchBox" placeholder="Введите название или декор..." oninput="filterOptions()">
        </div>

        <div class="form-group">
            <label for="materialSelect">Выберите позицию из списка:</label>
            <select id="materialSelect" onchange="showSelectedPrice()">
                <option value="">Загрузка данных...</option>
            </select>
        </div>

        <div id="priceDisplay" class="price-box" style="display: none;">
            <strong>Выбран материал:</strong> <span id="matName">-</span><br>
            <strong>Цена:</strong> <span id="matPrice" style="color: #5c1724; font-weight: bold;">-</span>
        </div>
    </div>
</div>

<div id="deniedContainer" class="access-denied" style="display: none;">
    <h2>⛔ Доступ ограничен</h2>
    <p>Калькулятор предназначен только для использования внутри офиса компании.</p>
    <p>Ваш IP-адрес: <span id="userIpSpan" class="ip-badge">проверка...</span></p>
</div>

<script>
    // 1. IP офиса
    const ALLOWED_IPS = ["217.19.209.217"];

    // 2. Источники Google Таблицы
    const BASE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTzDjxq-Tys5RiT0DTPpNNb4sv23gi1MTQFrGHlIqA4YT82Yd63eKoKK3nCfmTx3CDwdoFVlP2ii3bl/pub?output=csv";

    const SOURCES = {
        dsp: BASE_URL + "&gid=0", 
        mdf: BASE_URL + "&gid=96674774"
    };

    // Глобальное хранилище для предзагруженных данных
    const DATA_STORE = {
        dsp: [],
        mdf: []
    };

    // 3. Проверка IP
    async function checkIpAndInit() {
        try {
            const ipRes = await fetch("https://api.ipify.org?format=json");
            const ipData = await ipRes.json();
            if (ALLOWED_IPS.includes(ipData.ip)) {
                document.getElementById('appContainer').style.display = 'block';
                loadAllData();
            } else {
                document.getElementById('userIpSpan').innerText = ipData.ip;
                document.getElementById('deniedContainer').style.display = 'block';
            }
        } catch (e) {
            document.getElementById('appContainer').style.display = 'block';
            loadAllData();
        }
    }

    // Вспомогательная функция загрузки одного ресурса
    async function fetchCsvData(url) {
        const endpoints = [
            "https://corsproxy.io/?" + encodeURIComponent(url),
            "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
            url
        ];

        for (const ep of endpoints) {
            try {
                const res = await fetch(ep);
                if (res.ok) {
                    const text = await res.text();
                    if (text && text.length > 30) return text;
                }
            } catch (e) {}
        }
        return "";
    }

    // Парсер CSV текста в массив объектов
    function parseCsvToItems(csvText) {
        const items = [];
        const lines = csvText.split(/\r?\n/);

        lines.forEach(line => {
            if (!line.trim()) return;
            let cols = line.split(/[|,\t]/).map(item => item.replace(/^"|"$/g, '').trim());

            if (cols.length >= 1) {
                let title = cols[0];
                let priceNum = NaN;

                for (let i = 1; i < cols.length; i++) {
                    let match = cols[i].match(/(\d+[\.,]?\d*)/);
                    if (match) {
                        let cleanPrice = match[0].replace(',', '.');
                        let parsed = parseFloat(cleanPrice);
                        if (!isNaN(parsed) && parsed > 0) {
                            priceNum = parsed;
                            break;
                        }
                    }
                }

                const isHeader = title.includes("Фаворит") || 
                                 title.includes("ДСП, ДВП, МДФ") || 
                                 title.includes("#N/A") || 
                                 title.includes("#Н/Д") || 
                                 title.toLowerCase().includes("название");

                if (title && !isNaN(priceNum) && !isHeader) {
                    items.push({ name: title, price: priceNum });
                }
            }
        });

        return items;
    }

    // 4. ОДНОВРЕМЕННАЯ ПРЕДЗАГРУЗКА ВСЕХ КАТЕГОРИЙ
    async function loadAllData() {
        const statusBadge = document.getElementById('statusBadge');
        statusBadge.className = "status-badge status-loading";
        statusBadge.innerText = "⏳ Фоновая загрузка всей базы данных...";

        try {
            // Параллельно скачиваем ДСП и МДФ
            const [dspCsv, mdfCsv] = await Promise.all([
                fetchCsvData(SOURCES.dsp),
                fetchCsvData(SOURCES.mdf)
            ]);

            DATA_STORE.dsp = parseCsvToItems(dspCsv);
            DATA_STORE.mdf = parseCsvToItems(mdfCsv);

            const totalLoaded = DATA_STORE.dsp.length + DATA_STORE.mdf.length;

            if (totalLoaded > 0) {
                statusBadge.className = "status-badge status-success";
                statusBadge.innerText = `✓ Готово! Загружено позиций: ${totalLoaded} (ДСП: ${DATA_STORE.dsp.length}, МДФ: ${DATA_STORE.mdf.length})`;
                renderCurrentCategory();
            } else {
                throw new Error("Не удалось разобрать данные");
            }
        } catch (err) {
            console.error(err);
            statusBadge.className = "status-badge status-error";
            statusBadge.innerText = "⚠️ Ошибка загрузки базы данных.";
        }
    }

    // 5. Отрисовка выбранной категории из памяти (мгновенно)
    function renderCurrentCategory() {
        const categoryKey = document.getElementById('categorySelect').value;
        const selectEl = document.getElementById('materialSelect');
        const items = DATA_STORE[categoryKey] || [];

        selectEl.innerHTML = '<option value="">-- Выберите позицию --</option>';

        items.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item.price;
            opt.dataset.name = item.name;
            opt.textContent = `${item.name} — ${item.price} руб.`;
            selectEl.appendChild(opt);
        });

        // Сбрасываем поиск
        document.getElementById('searchBox').value = '';
        filterOptions();
    }

    // 6. Переключение категории
    function switchCategory() {
        document.getElementById('priceDisplay').style.display = 'none';
        renderCurrentCategory();
    }

    // 7. Поиск по списку
    function filterOptions() {
        const query = document.getElementById('searchBox').value.toLowerCase();
        const options = document.getElementById('materialSelect').options;

        for (let i = 1; i < options.length; i++) {
            const text = options[i].textContent.toLowerCase();
            options[i].style.display = text.includes(query) ? "" : "none";
        }
    }

    // 8. Показ выбранного элемента
    function showSelectedPrice() {
        const select = document.getElementById('materialSelect');
        const opt = select.options[select.selectedIndex];
        const display = document.getElementById('priceDisplay');

        if (opt && opt.value) {
            document.getElementById('matName').innerText = opt.dataset.name;
            document.getElementById('matPrice').innerText = `${opt.value} руб.`;
            display.style.display = "block";
        } else {
            display.style.display = "none";
        }
    }

    window.addEventListener('DOMContentLoaded', checkIpAndInit);
</script>

</body>
</html>
