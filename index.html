<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог ДСП — Фаворит</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f1f5f9;
            padding: 20px;
            color: #1e293b;
            margin: 0;
        }

        .card {
            max-width: 550px;
            margin: 40px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #cbd5e1;
        }

        h3 {
            margin-top: 0;
            color: #5c1724; /* Фирменный бордовый «Фаворит» */
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .status-loading { background: #fef3c7; color: #b45309; }
        .status-success { background: #dcfce7; color: #15803d; }
        .status-error { background: #fee2e2; color: #b91c1c; }

        .form-group { margin-bottom: 15px; }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus { border-color: #5c1724; }

        .price-box {
            margin-top: 15px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 8px;
            border-left: 4px solid #5c1724;
            font-size: 1rem;
            line-height: 1.5;
        }

        /* Экран блокировки по IP */
        .access-denied {
            max-width: 450px;
            margin: 80px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            border-top: 5px solid #ef4444;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .access-denied h2 { color: #b91c1c; margin-top: 0; }
        .access-denied p { color: #64748b; font-size: 0.95rem; }
        .ip-badge { background: #f1f5f9; padding: 4px 8px; border-radius: 4px; font-family: monospace; font-weight: bold; }
    </style>
</head>
<body>

<!-- Основной интерфейс калькулятора -->
<div id="appContainer" style="display: none;">
    <div class="card">
        <h3>Каталог ДСП (favoritmd.com)</h3>
        <div id="statusBadge" class="status-badge status-loading">⏳ Подключение к базе Google Таблиц...</div>

        <div class="form-group">
            <label for="searchBox">🔍 Быстрый поиск декора:</label>
            <input type="text" id="searchBox" placeholder="Введите название (Дуб, Акация, Egger, Swisspan)..." oninput="filterOptions()">
        </div>

        <div class="form-group">
            <label for="dspSelect">Выберите ДСП из списка:</label>
            <select id="dspSelect" onchange="showSelectedPrice()">
                <option value="">Загрузка данных...</option>
            </select>
        </div>

        <div id="priceDisplay" class="price-box" style="display: none;">
            <strong>Выбран декор:</strong> <span id="dspName">-</span><br>
            <strong>Цена за м²:</strong> <span id="dspPrice" style="color: #5c1724; font-weight: bold;">-</span>
        </div>
    </div>
</div>

<!-- Окно блокировки IP -->
<div id="deniedContainer" class="access-denied" style="display: none;">
    <h2>⛔ Доступ ограничен</h2>
    <p>Калькулятор предназначен только для использования внутри офисов компании.</p>
    <p>Ваш IP-адрес: <span id="userIpSpan" class="ip-badge">проверка...</span></p>
</div>

<script>
    // 1. Настройка офисных IP
    const ALLOWED_IPS = [
        "217.19.209.217" // Основной IP офиса Фаворит
    ];

    const GOOGLE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTzDjxq-Tys5RiT0DTPpNNb4sv23gi1MTQFrGHlIqA4YT82Yd63eKoKK3nCfmTx3CDwdoFVlP2ii3bl/pub?gid=0&single=true&output=csv";

    // 2. Проверка IP
    async function checkIpAndInit() {
        try {
            const ipRes = await fetch("https://api.ipify.org?format=json");
            const ipData = await ipRes.json();
            const userIp = ipData.ip;

            if (ALLOWED_IPS.includes(userIp)) {
                document.getElementById('appContainer').style.display = 'block';
                loadData();
            } else {
                document.getElementById('userIpSpan').innerText = userIp;
                document.getElementById('deniedContainer').style.display = 'block';
            }
        } catch (e) {
            console.warn("Проверка IP не удалась, пропускаем:", e);
            document.getElementById('appContainer').style.display = 'block';
            loadData();
        }
    }

    // 3. Загрузка и универсальный парсинг
    async function loadData() {
        const statusBadge = document.getElementById('statusBadge');
        const selectEl = document.getElementById('dspSelect');

        const endpoints = [
            "https://corsproxy.io/?" + encodeURIComponent(GOOGLE_CSV_URL),
            "https://api.allorigins.win/raw?url=" + encodeURIComponent(GOOGLE_CSV_URL),
            GOOGLE_CSV_URL
        ];

        let textData = "";

        for (const url of endpoints) {
            try {
                const res = await fetch(url);
                if (res.ok) {
                    textData = await res.text();
                    if (textData && textData.length > 30) break;
                }
            } catch (e) {
                console.warn("Прокси недоступен, проба следующего:", url);
            }
        }

        try {
            if (!textData) throw new Error("Не удалось получить CSV-данные");

            const lines = textData.split(/\r?\n/);
            selectEl.innerHTML = '<option value="">-- Выберите декор ДСП --</option>';
            let count = 0;

            lines.forEach(line => {
                if (!line.trim()) return;

                // Разделяем по разделителям |, comma или tab
                let cols = line.split(/[|,\t]/).map(item => item.replace(/^"|"$/g, '').trim());

                if (cols.length >= 1) {
                    let title = cols[0];

                    // Ищем первое числовое значение во всех оставшихся столбцах
                    let priceNum = NaN;
                    for (let i = 1; i < cols.length; i++) {
                        // Извлекаем первое число с точкой/запятой из ячейки
                        let match = cols[i].match(/(\d+[\.,]?\d*)/);
                        if (match) {
                            let cleanPrice = match[0].replace(',', '.');
                            let parsed = parseFloat(cleanPrice);
                            if (!isNaN(parsed) && parsed > 0) {
                                priceNum = parsed;
                                break;
                            }
                        }
                    }

                    // Отсекаем технические заголовки
                    const isHeader = title.includes("Фаворит") || title.includes("ДСП, ДВП, МДФ") || title.includes("#N/A") || title.includes("#Н/Д") || title.toLowerCase().includes("название");

                    if (title && !isNaN(priceNum) && !isHeader) {
                        const opt = document.createElement('option');
                        opt.value = priceNum;
                        opt.dataset.name = title;
                        opt.textContent = `${title} — ${priceNum} руб.`;
                        selectEl.appendChild(opt);
                        count++;
                    }
                }
            });

            if (count > 0) {
                statusBadge.className = "status-badge status-success";
                statusBadge.innerText = `✓ Успешно загружено ${count} декоров ДСП`;
            } else {
                throw new Error("Не найдено корректных строк");
            }

        } catch (err) {
            console.error("Ошибка обработки:", err);
            statusBadge.className = "status-badge status-error";
            statusBadge.innerText = "⚠️ Ошибка подгрузки данных. Проверьте публикацию Google Таблицы.";
            selectEl.innerHTML = '<option value="">Ошибка подгрузки данных</option>';
        }
    }

    // 4. Фильтр поиска
    function filterOptions() {
        const query = document.getElementById('searchBox').value.toLowerCase();
        const options = document.getElementById('dspSelect').options;

        for (let i = 1; i < options.length; i++) {
            const text = options[i].textContent.toLowerCase();
            options[i].style.display = text.includes(query) ? "" : "none";
        }
    }

    // 5. Показ цены
    function showSelectedPrice() {
        const select = document.getElementById('dspSelect');
        const opt = select.options[select.selectedIndex];
        const display = document.getElementById('priceDisplay');

        if (opt && opt.value) {
            document.getElementById('dspName').innerText = opt.dataset.name;
            document.getElementById('dspPrice').innerText = `${opt.value} руб.`;
            display.style.display = "block";
        } else {
            display.style.display = "none";
        }
    }

    window.addEventListener('DOMContentLoaded', checkIpAndInit);
</script>

</body>
</html>
